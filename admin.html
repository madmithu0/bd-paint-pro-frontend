<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BD Paint Pro - Super Admin</title>
<style>
*{margin:0; padding:0; box-sizing:border-box}
body{font-family: 'Segoe UI', sans-serif; background:#f8f9fa; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:15px}
.box{background:#ffffff; padding:30px 25px; border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,0.08); width:100%; max-width:380px; text-align:center; border:1px solid #eee}
h2{margin-bottom:5px; color:#212121}
p{color:#666; font-size:14px; margin-bottom:10px}
input{width:100%; padding:14px; margin:18px 0 12px 0; border:1.5px solid #e0e0e0; border-radius:10px; font-size:15px; outline:none; transition:0.2s}
input:focus{border-color:#FFC107}
button{width:100%; padding:14px; background:#FFC107; border:none; border-radius:10px; font-weight:700; font-size:16px; cursor:pointer; transition:0.2s; color:#000}
button:active{transform:scale(0.98)}
.contact{margin-top:20px; font-size:13px; color:#888; background:#f8f8f8; padding:10px; border-radius:8px}
#msg{font-size:13px; min-height:18px}
</style>
</head>
<body>
<div class="box" id="loginBox">
<h2>BD Paint Pro</h2>
<p>Super Admin Secure Login</p>
<input type="password" id="pass" placeholder="Enter Password" autocomplete="off">
<button id="loginBtn" onclick="login()">Login</button>
<div class="contact">Support: 01611231998</div>
<p id="msg"></p>
</div>

<div class="box" id="adminBox" style="display:none">
<h2>Welcome Mithu! ✅</h2>
<p style="margin-top:15px; color:#2e7d32; font-weight:600;">Authenticated Successfully</p>
<p style="margin-top:15px;">Contact: <b>01611231998</b></p>
<div style="margin-top:20px">
<a href="index.html" style="text-decoration:none"><button>Go to Website</button></a>
</div>
</div>

<script>
const SUPER_ADMIN_PASSWORD = "24/12/1998Mithu";
const passInput = document.getElementById('pass');
const msg = document.getElementById('msg');

function login(){
  const p = passInput.value.trim();
  if(!p){
    msg.style.color = "#d32f2f";
    msg.innerText = "Please enter password!";
    return;
  }
  if(p === SUPER_ADMIN_PASSWORD){
    msg.innerText = "";
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminBox').style.display='block';
  } else {
    msg.style.color = "#d32f2f";
    msg.innerText = "Wrong Password!";
    passInput.value = "";
    passInput.focus();
  }
}

// Enter key support - bug fix
passInput.addEventListener("keyup", function(e){
  if(e.key === "Enter"){ login(); }
});
</script>
</body>
</html>
